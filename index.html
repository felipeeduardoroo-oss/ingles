<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>1000 Words · Flashcards + Grammar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- DASHBOARD -->
    <div id="dashboard" class="screen active">
        <div class="container">
            <header>
                <h1>📚 1000 Words+</h1>
                <span class="level-badge" id="levelBadge">Nível A</span>
            </header>

            <!-- Configurações rápidas -->
            <div class="config-panel">
                <div class="config-group">
                    <span class="config-label">Resposta:</span>
                    <div class="btn-group" id="modeToggle">
                        <button class="config-btn active" data-mode="click">Clique</button>
                        <button class="config-btn" data-mode="type">Digitação</button>
                    </div>
                </div>
                <div class="config-group">
                    <span class="config-label">Conteúdo:</span>
                    <div class="btn-group" id="contentToggle">
                        <button class="config-btn active" data-content="vocabulary">Vocabulário</button>
                        <button class="config-btn" data-content="cloze">Contexto</button>
                        <button class="config-btn" data-content="grammar">Gramática</button>
                        <button class="config-btn" data-content="mixed">Misto</button>
                    </div>
                </div>
            </div>

            <div class="score-grid">
                <div class="score-item">
                    <span class="score-label">Dominadas</span>
                    <span class="score-value" id="dominatedCount">0 / 100</span>
                </div>
                <div class="score-item">
                    <span class="score-label">Taxa sessão</span>
                    <span class="score-value" id="sessionRate">--</span>
                </div>
            </div>

            <div class="progress-area">
                <div class="progress-label">
                    <span>Progresso do nível</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="progressFill" style="width: 0%;"></div>
                    <div class="progress-marker" style="left: 80%;">🎯 80%</div>
                </div>
                <div class="level-status" id="levelStatus">
                    🔒 Próximo nível bloqueado (atinga 80%)
                </div>
            </div>

            <button class="btn-primary btn-large" id="startSessionBtn">▶ Iniciar Sessão (12 cards)</button>
            
            <div class="history-mini">
                <span>Última sessão: <span id="lastSessionInfo">Nenhuma ainda</span></span>
            </div>
        </div>
    </div>

    <!-- SESSÃO DE FLASHCARDS -->
    <div id="session" class="screen">
        <div class="container">
            <div class="session-header">
                <span id="cardCounter">Card 1 / 12</span>
                <span id="sessionTimer">⏱️ 0s</span>
            </div>

            <div class="flashcard" id="flashcard">
                <div class="word-display" id="wordDisplay">hello</div>
                
                <!-- Nova área para fonética e tradução -->
                <div id="extraInfo" class="extra-info">
                    <div id="phoneticDisplay" style="display: none; font-size: 1rem; color: #64748B; margin-bottom: 10px;"></div>
                    <div id="translationDisplay" style="display: none; font-size: 1rem; color: #475569; margin-bottom: 16px;"></div>
                </div>

                <!-- Área para múltipla escolha -->
                <div class="options-grid" id="optionsContainer"></div>
                
                <!-- Área para digitação -->
                <div class="type-area" id="typeArea" style="display: none;">
                    <input type="text" id="typeInput" placeholder="Digite a resposta..." autocomplete="off">
                    <button class="btn-primary btn-small" id="typeSubmit">Confirmar</button>
                </div>

                <!-- Feedback normal (acerto/erro) -->
                <div class="feedback-overlay" id="feedbackOverlay">
                    <span id="feedbackIcon">✅</span>
                    <span id="feedbackText">Correto!</span>
                    <span id="feedbackJustification" style="font-size: 0.8rem; font-weight: 400; display: none; margin-top: 4px;"></span>
                </div>
            </div>

            <button class="btn-secondary btn-small" id="quitSessionBtn">✕ Sair e voltar</button>
        </div>
    </div>

    <!-- RESUMO PÓS-SESSÃO -->
    <div id="sessionEnd" class="screen">
        <div class="container end-container">
            <div class="end-icon" id="endIcon">🏆</div>
            <h2 id="endTitle">Sessão concluída!</h2>
            <div class="end-stats">
                <div class="end-stat"><span>Acertos</span> <strong id="endCorrect">0</strong></div>
                <div class="end-stat"><span>Erros</span> <strong id="endWrong">0</strong></div>
                <div class="end-stat"><span>Pontuação</span> <strong id="endScore">0%</strong></div>
            </div>
            <button class="btn-primary btn-large" id="endGoDashboardBtn">📊 Ver Dashboard</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
